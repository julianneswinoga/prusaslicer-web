name: pr-from-upstream-release
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 4 * * *'  # Every day at 04:00

jobs:
  check-upstream-release:
    runs-on: 'ubuntu-latest'
    environment: julie_bot_env
    steps:
      - uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5

      - name: Read hcl PRUSASLICER_TAG
        run: |
          set -euo pipefail

          cd docker/
          hcl_prusaslicer_tag=$(docker buildx bake --print | jq -er '.target."prusaslicer-base".args.PRUSASLICER_TAG')
          hcl_prusaslicer_version=$(echo "$hcl_prusaslicer_tag" | sed 's/^version_//')
          echo "hcl_prusaslicer_version=$hcl_prusaslicer_version" | tee -a "$GITHUB_ENV"

      - name: Get latest upstream release tag
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --show-error --silent --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/prusa3d/PrusaSlicer/releases/latest)
          latest_upstream_tag=$(jq -er '.tag_name | strings | select(length > 0)' <<< "$response")

          if [[ "$latest_upstream_tag" != version_* ]]; then
            echo "Invalid upstream PrusaSlicer tag: $latest_upstream_tag" >&2
            exit 1
          fi

          latest_upstream_version=$(echo "$latest_upstream_tag" | sed 's/^version_//')
          echo "latest_upstream_version=$latest_upstream_version" | tee -a "$GITHUB_ENV"

      - name: Check if upstream has released a newer version
        run: |
          set -euo pipefail
          set -x

          if dpkg --compare-versions "$latest_upstream_version" 'gt' "$hcl_prusaslicer_version"; then
            echo 'upstream_has_newer_release=true' | tee -a "$GITHUB_ENV"
          else
            echo 'upstream_has_newer_release=false' | tee -a "$GITHUB_ENV"
          fi

      - name: Update source code
        if: ${{ env.upstream_has_newer_release == 'true' }}
        run: |
          perl -i -pe 's|\Q${{ env.hcl_prusaslicer_version }}\E|${{ env.latest_upstream_version }}|g' docker/docker-bake.hcl
          perl -i -pe 's|\Q${{ env.hcl_prusaslicer_version }}\E|${{ env.latest_upstream_version }}|g' docker/prusaslicer-base/Dockerfile

      - name: Create Pull Request
        if: ${{ env.upstream_has_newer_release == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          # Needed to fuss with bots for the PR to trigger the normal workflows:
          # https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: |
            Automatic update from ${{ env.hcl_prusaslicer_version }} to ${{ env.latest_upstream_version }}
          branch: |
            autoupdate/${{ env.latest_upstream_version }}
          title: |
            Automatic update from ${{ env.hcl_prusaslicer_version }} to ${{ env.latest_upstream_version }}
          body: |
            Automatic update from ${{ env.hcl_prusaslicer_version }} to ${{ env.latest_upstream_version }}
